<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DBMS CRUD Operations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #141414;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #e50914;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .login-screen {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #222;
            border-radius: 8px;
        }
        
        .login-screen h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        
        .tab {
            padding: 10px 20px;
            background: #222;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
        }
        
        .tab.active {
            background: #e50914;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 20px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #f40612;
        }
        
        button.secondary {
            background: #333;
        }
        
        button.secondary:hover {
            background: #444;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #222;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        th {
            background: #e50914;
            font-weight: bold;
        }
        
        tr:hover {
            background: #2a2a2a;
        }
        
        .actions {
            display: flex;
            gap: 5px;
        }
        
        .actions button {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .close {
            font-size: 28px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }
        
        .message.success {
            background: #0f5132;
            border: 1px solid #0a3622;
        }
        
        .message.error {
            background: #842029;
            border: 1px solid #58151c;
        }
        
        .message.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <h2>Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter admin password" />
        <button onclick="login()" style="width: 100%; margin-top: 10px;">Login</button>
        <p id="loginError" style="color: #e50914; margin-top: 10px; display: none;">Invalid password</p>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" style="display: none;">
        <div class="container">
            <h1>🔧 Admin Panel - DBMS CRUD Operations</h1>
            
            <div id="message" class="message"></div>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('content')">Content</button>
                <button class="tab" onclick="switchTab('users')">Users</button>
                <button class="tab" onclick="switchTab('profiles')">Profiles</button>
            </div>
            
            <!-- Content Tab -->
            <div id="content-tab" class="tab-content active">
                <div class="controls">
                    <button onclick="loadContent()">🔄 Refresh</button>
                    <button onclick="openCreateModal('content')">➕ Add Content</button>
                </div>
                <div id="content-table"></div>
            </div>
            
            <!-- Users Tab -->
            <div id="users-tab" class="tab-content">
                <div class="controls">
                    <button onclick="loadUsers()">🔄 Refresh</button>
                </div>
                <div id="users-table"></div>
            </div>
            
            <!-- Profiles Tab -->
            <div id="profiles-tab" class="tab-content">
                <div class="controls">
                    <button onclick="loadProfiles()">🔄 Refresh</button>
                </div>
                <div id="profiles-table"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Create/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/admin';
        let currentTab = 'content';

        // Login
        async function login() {
            const password = document.getElementById('adminPassword').value;
            try {
                const response = await fetch(`${API_BASE}/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                
                if (response.ok && await response.json()) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadContent();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
            
            if (tab === 'content') loadContent();
            else if (tab === 'users') loadUsers();
            else if (tab === 'profiles') loadProfiles();
        }

        // Show message
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type} active`;
            setTimeout(() => msg.classList.remove('active'), 3000);
        }

        // ========== CONTENT CRUD ==========
        
        async function loadContent() {
            try {
                const response = await fetch(`${API_BASE}/content/all`);
                const data = await response.json();
                
                let html = '<table><thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Duration</th><th>Rating</th><th>Location</th><th>Actions</th></tr></thead><tbody>';
                
                data.forEach(item => {
                    html += `<tr>
                        <td>${item.id}</td>
                        <td>${item.title}</td>
                        <td>${item.genre || 'N/A'}</td>
                        <td>${item.duration || 'N/A'} min</td>
                        <td>${item.rating || 'N/A'}</td>
                        <td>${item.videoLocation || 'youtube'}</td>
                        <td class="actions">
                            <button onclick="editContent(${item.id})">Edit</button>
                            <button class="secondary" onclick="deleteContent(${item.id})">Delete</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('content-table').innerHTML = html;
            } catch (error) {
                showMessage('Error loading content: ' + error.message, 'error');
            }
        }

        function openCreateModal(type) {
            document.getElementById('modalTitle').textContent = 'Create Content';
            document.getElementById('modalBody').innerHTML = `
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="title" required />
                </div>
                <div class="form-group">
                    <label>Genre</label>
                    <input type="text" id="genre" />
                </div>
                <div class="form-group">
                    <label>Release Date</label>
                    <input type="date" id="releaseDate" />
                </div>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" id="duration" />
                </div>
                <div class="form-group">
                    <label>Rating</label>
                    <input type="text" id="rating" placeholder="PG-13, R, etc." />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Video Location</label>
                    <select id="videoLocation">
                        <option value="youtube">YouTube</option>
                        <option value="local">Local</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>YouTube URL</label>
                    <input type="text" id="youtubeUrl" />
                </div>
                <div class="form-group">
                    <label>Local Video Path</label>
                    <input type="text" id="localVideoPath" placeholder="/path/to/video.mp4" />
                </div>
                <div class="form-group">
                    <label>Required Plan</label>
                    <select id="requiredPlan">
                        <option value="Basic">Basic</option>
                        <option value="Standard">Standard</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>
                <button onclick="createContent()">Create</button>
                <button class="secondary" onclick="closeModal()">Cancel</button>
            `;
            document.getElementById('modal').classList.add('active');
        }

        async function createContent() {
            const content = {
                title: document.getElementById('title').value,
                genre: document.getElementById('genre').value,
                releaseDate: document.getElementById('releaseDate').value,
                duration: parseInt(document.getElementById('duration').value) || 0,
                rating: document.getElementById('rating').value,
                description: document.getElementById('description').value,
                videoLocation: document.getElementById('videoLocation').value,
                youtubeUrl: document.getElementById('youtubeUrl').value,
                localVideoPath: document.getElementById('localVideoPath').value,
                requiredPlan: document.getElementById('requiredPlan').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/content/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(content)
                });
                
                if (response.ok) {
                    showMessage('Content created successfully!');
                    closeModal();
                    loadContent();
                } else {
                    showMessage('Error creating content', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function editContent(id) {
            try {
                const response = await fetch(`${API_BASE}/content/${id}`);
                const content = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Content';
                document.getElementById('modalBody').innerHTML = `
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" value="${content.title}" required />
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <input type="text" id="genre" value="${content.genre || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Release Date</label>
                        <input type="date" id="releaseDate" value="${content.releaseDate || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Duration (minutes)</label>
                        <input type="number" id="duration" value="${content.duration || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Rating</label>
                        <input type="text" id="rating" value="${content.rating || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="3">${content.description || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Video Location</label>
                        <select id="videoLocation">
                            <option value="youtube" ${content.videoLocation === 'youtube' ? 'selected' : ''}>YouTube</option>
                            <option value="local" ${content.videoLocation === 'local' ? 'selected' : ''}>Local</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>YouTube URL</label>
                        <input type="text" id="youtubeUrl" value="${content.youtubeUrl || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Local Video Path</label>
                        <input type="text" id="localVideoPath" value="${content.localVideoPath || ''}" />
                    </div>
                    <div class="form-group">
                        <label>Required Plan</label>
                        <select id="requiredPlan">
                            <option value="Basic" ${content.requiredPlan === 'Basic' ? 'selected' : ''}>Basic</option>
                            <option value="Standard" ${content.requiredPlan === 'Standard' ? 'selected' : ''}>Standard</option>
                            <option value="Premium" ${content.requiredPlan === 'Premium' ? 'selected' : ''}>Premium</option>
                        </select>
                    </div>
                    <button onclick="updateContent(${id})">Update</button>
                    <button class="secondary" onclick="closeModal()">Cancel</button>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (error) {
                showMessage('Error loading content: ' + error.message, 'error');
            }
        }

        async function updateContent(id) {
            const content = {
                title: document.getElementById('title').value,
                genre: document.getElementById('genre').value,
                releaseDate: document.getElementById('releaseDate').value,
                duration: parseInt(document.getElementById('duration').value) || 0,
                rating: document.getElementById('rating').value,
                description: document.getElementById('description').value,
                videoLocation: document.getElementById('videoLocation').value,
                youtubeUrl: document.getElementById('youtubeUrl').value,
                localVideoPath: document.getElementById('localVideoPath').value,
                requiredPlan: document.getElementById('requiredPlan').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/content/update/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(content)
                });
                
                if (response.ok) {
                    showMessage('Content updated successfully!');
                    closeModal();
                    loadContent();
                } else {
                    showMessage('Error updating content', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function deleteContent(id) {
            if (!confirm('Are you sure you want to delete this content?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/content/delete/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showMessage('Content deleted successfully!');
                    loadContent();
                } else {
                    showMessage('Error deleting content', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // ========== USERS CRUD ==========
        
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/users/all`);
                const data = await response.json();
                
                let html = '<table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Plan</th><th>Actions</th></tr></thead><tbody>';
                
                data.forEach(item => {
                    html += `<tr>
                        <td>${item.id}</td>
                        <td>${item.username}</td>
                        <td>${item.email}</td>
                        <td>${item.subscriptionPlan || 'N/A'}</td>
                        <td class="actions">
                            <button onclick="editUser(${item.id})">Edit</button>
                            <button class="secondary" onclick="deleteUser(${item.id})">Delete</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('users-table').innerHTML = html;
            } catch (error) {
                showMessage('Error loading users: ' + error.message, 'error');
            }
        }

        async function editUser(id) {
            try {
                const response = await fetch(`${API_BASE}/users/${id}`);
                const user = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit User';
                document.getElementById('modalBody').innerHTML = `
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" value="${user.username}" readonly />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" value="${user.email}" />
                    </div>
                    <div class="form-group">
                        <label>Subscription Plan</label>
                        <select id="subscriptionPlan">
                            <option value="Basic" ${user.subscriptionPlan === 'Basic' ? 'selected' : ''}>Basic</option>
                            <option value="Standard" ${user.subscriptionPlan === 'Standard' ? 'selected' : ''}>Standard</option>
                            <option value="Premium" ${user.subscriptionPlan === 'Premium' ? 'selected' : ''}>Premium</option>
                        </select>
                    </div>
                    <button onclick="updateUser(${id})">Update</button>
                    <button class="secondary" onclick="closeModal()">Cancel</button>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (error) {
                showMessage('Error loading user: ' + error.message, 'error');
            }
        }

        async function updateUser(id) {
            const user = {
                email: document.getElementById('email').value,
                subscriptionPlan: document.getElementById('subscriptionPlan').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/users/update/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(user)
                });
                
                if (response.ok) {
                    showMessage('User updated successfully!');
                    closeModal();
                    loadUsers();
                } else {
                    showMessage('Error updating user', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user? This will also delete all associated profiles.')) return;
            
            try {
                const response = await fetch(`${API_BASE}/users/delete/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showMessage('User deleted successfully!');
                    loadUsers();
                } else {
                    showMessage('Error deleting user', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // ========== PROFILES CRUD ==========
        
        async function loadProfiles() {
            try {
                const response = await fetch(`${API_BASE}/profiles/all`);
                const data = await response.json();
                
                let html = '<table><thead><tr><th>ID</th><th>Profile Name</th><th>User ID</th><th>Kid Profile</th><th>Actions</th></tr></thead><tbody>';
                
                data.forEach(item => {
                    html += `<tr>
                        <td>${item.id}</td>
                        <td>${item.profileName}</td>
                        <td>${item.user?.id || 'N/A'}</td>
                        <td>${item.kidProfile ? 'Yes' : 'No'}</td>
                        <td class="actions">
                            <button onclick="editProfile(${item.id})">Edit</button>
                            <button class="secondary" onclick="deleteProfile(${item.id})">Delete</button>
                        </td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('profiles-table').innerHTML = html;
            } catch (error) {
                showMessage('Error loading profiles: ' + error.message, 'error');
            }
        }

        async function editProfile(id) {
            try {
                const response = await fetch(`${API_BASE}/profiles/${id}`);
                const profile = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Profile';
                document.getElementById('modalBody').innerHTML = `
                    <div class="form-group">
                        <label>Profile Name</label>
                        <input type="text" id="profileName" value="${profile.profileName}" />
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="kidProfile" ${profile.kidProfile ? 'checked' : ''} />
                            Kid Profile
                        </label>
                    </div>
                    <button onclick="updateProfile(${id})">Update</button>
                    <button class="secondary" onclick="closeModal()">Cancel</button>
                `;
                document.getElementById('modal').classList.add('active');
            } catch (error) {
                showMessage('Error loading profile: ' + error.message, 'error');
            }
        }

        async function updateProfile(id) {
            const profile = {
                profileName: document.getElementById('profileName').value,
                kidProfile: document.getElementById('kidProfile').checked
            };
            
            try {
                const response = await fetch(`${API_BASE}/profiles/update/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profile)
                });
                
                if (response.ok) {
                    showMessage('Profile updated successfully!');
                    closeModal();
                    loadProfiles();
                } else {
                    showMessage('Error updating profile', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function deleteProfile(id) {
            if (!confirm('Are you sure you want to delete this profile?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/profiles/delete/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showMessage('Profile deleted successfully!');
                    loadProfiles();
                } else {
                    showMessage('Error deleting profile', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Modal functions
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Allow Enter key for login
        document.getElementById('adminPassword')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
